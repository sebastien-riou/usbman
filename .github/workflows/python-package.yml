# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip3 install -r requirements.txt
        pipenv --python /bin/python3 install -d
        # python -m pip install --require-hashes --upgrade pip
        # python -m pip install --require-hashes black ruff pytest
        # python -m pip install --require-hashes .
        # if [ -f requirements.txt ]; then pip install --require-hashes -r requirements.txt; fi
    - name: Lint 
      run: |
        pipenv run ./lint
    - name: Test with pytest
      run: |
        pipenv run pytest test
    # - if: matrix.python-version == '3.12' && runner.os == 'Linux'
    #   name: Doc
    #   run: |
    #     cd docs
    #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    #     make clean doctest html